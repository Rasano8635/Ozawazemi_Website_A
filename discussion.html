<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ディスカッション体験ゲーム</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* 1画面に収めるため余白を削除し、スクロールを禁止 */
body { 
    margin: 0; padding: 0; 
    font-family: 'M PLUS Rounded 1c', sans-serif; 
    background: linear-gradient(180deg, #f5fbff 0%, #eef6ff 35%, #f7faff 100%); 
    color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
}

.blur-circle { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -2; opacity: 0.45; }
.blue-main { width: 280px; height: 280px; background: #7cc7ff; top: -60px; left: -40px; }
.blue-sub { width: 340px; height: 340px; background: #b0d8ff; bottom: -80px; right: -80px; }

/* 被らないように fixed かつ z-index を 1000 に設定 */
.top-return-btn { position: fixed; top: 20px; left: 20px; background: rgba(255,255,255,0.9); color: #4aa8ff; padding: 10px 20px; border-radius: 99px; font-weight: 800; text-decoration: none; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(74,168,255,0.15); border: none; cursor: pointer; z-index: 1000; transition: 0.2s; display: inline-block; }
.top-return-btn:hover { background: #4aa8ff; color: #fff; transform: scale(1.05); }

/* margin-topを 90px に維持しつつ、コンテンツを縦方向の中央に配置 */
.main-wrapper { display: flex; width: 100%; max-width: 1200px; margin: 90px auto 0 auto; gap: 24px; padding: 0 20px; flex-grow: 1; align-items: center; }
.glass-panel { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px rgba(50, 120, 200, 0.06); position: relative; z-index: 5; }
.sidebar-left { width: 25%; padding: 30px; height: fit-content; }
.sidebar-left h2 { font-size: 1.3rem; color: #4aa8ff; margin-bottom: 20px; font-weight: 800; border-bottom: 2px dashed #b0d8ff; padding-bottom: 10px; }
.sidebar-left p { line-height: 2.2; color: #555; font-weight: 700; font-size: 0.95rem; }
.container { width: 50%; padding: 40px; text-align: center; display: flex; flex-direction: column; }
.sidebar-right { width: 25%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; height: fit-content; align-self: center; background: transparent; box-shadow: none; border: none; }
h2#text { font-size: 1.45rem; font-weight: 800; color: #222; margin-bottom: 20px; line-height: 1.6; min-height: 4.8rem; display: flex; align-items: center; justify-content: center; }
.progress-wrapper { margin-bottom: 25px; }
.progress-bar { width: 100%; height: 14px; background: #eef6ff; border-radius: 20px; overflow: hidden; border: 1px solid rgba(74,168,255,0.2); }
#progress { height: 100%; width: 0%; background: linear-gradient(90deg, #74c2ff, #4aa8ff); transition: 0.4s ease-out; border-radius: 20px; }
.progress-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.85rem; color: #4aa8ff; font-weight: 700; }

/* BGMセレクタ用 */
.bgm-selector { margin-bottom: 20px; font-weight: 800; color: #555; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.arrow-btn { background: #fff; border: 2px solid #4aa8ff; color: #4aa8ff; border-radius: 50%; width: 42px; height: 42px; font-size: 1.1rem; font-weight: 900; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(74,168,255,0.1); }
.arrow-btn:hover { background: #eef6ff; transform: scale(1.1); }
.arrow-btn:active { transform: scale(0.9); }

#interactive-area { min-height: 320px; display: flex; flex-direction: column; width: 100%; align-items: center; justify-content: flex-start; }
#choices { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }

button.choice-btn { width: 100%; padding: 14px 20px; border: none; border-radius: 16px; background: white; color: #555; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 15px rgba(0,0,0,0.05); border: 2px solid transparent; text-align: left; line-height: 1.4; }
button.choice-btn:hover:not(:disabled) { transform: translateY(-3px); border-color: #4aa8ff; color: #4aa8ff; box-shadow: 0 8px 20px rgba(74,168,255,0.15); }
button.choice-btn:disabled { opacity: 0.9; cursor: default; }
button.choice-btn.selected { border-color: #ff6b81; box-shadow: 0 0 10px rgba(255,107,129,0.3); background: #fff0f2; color: #c92a2a; }

#feedback { width: 100%; min-height: 60px; font-size: 1.05rem; margin-bottom: 15px; color: #ff6b81; font-weight: 800; line-height: 1.6; text-align: left; background: rgba(255,255,255,0.8); padding: 20px; border-radius: 16px; display: none; border: 1px solid rgba(255,107,129,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }

#next-step-btn { display: none; margin: 10px auto 0 auto; padding: 14px 50px; border-radius: 99px; background: linear-gradient(135deg, #4aa8ff, #74c2ff); color: white; font-weight: 800; font-size: 1.1rem; border: none; cursor: pointer; box-shadow: 0 6px 15px rgba(74,168,255,0.3); transition: 0.2s; }
#next-step-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,168,255,0.4); }

/* 吹き出しの横幅を固定して被りを防ぐ */
.prof-bubble-large { 
    background: rgba(255, 255, 255, 0.95); 
    border: 3px solid #4aa8ff; 
    border-radius: 20px; 
    padding: 14px 18px; 
    font-size: 0.95rem; 
    font-weight: 800; 
    color: #333; 
    box-shadow: 0 10px 25px rgba(74,168,255,0.25); 
    position: relative; 
    text-align: left; 
    line-height: 1.6; 
    display: inline-block; 
    margin-bottom: 15px; 
    cursor: pointer; 
    user-select: none; 
    width: 240px; /* 固定幅 */
    box-sizing: border-box;
}
.prof-bubble-large::after, .prof-bubble-large::before { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-style: solid; width: 0; }
.prof-bubble-large::before { border-width: 12px 12px 0; border-color: #4aa8ff transparent transparent transparent; bottom: -12px; } 
.prof-bubble-large::after { border-width: 8px 8px 0; border-color: rgba(255,255,255,0.95) transparent transparent transparent; bottom: -8px; }

/* z-index を高めに設定し、右端に少し寄せる */
#prof-container { 
    position: fixed; 
    bottom: 20px; 
    right: 20px; 
    cursor: pointer; 
    transition: 0.2s; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    z-index: 50; 
}
#prof-container:hover { transform: scale(1.05); }
#prof-avatar { height: 200px; width: 200px; object-fit: contain; object-position: bottom; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); transition: 0.2s; }
#current-theme-display { font-size: 1.15rem; color: #ff6b81; font-weight: 800; margin-bottom: 20px; display: none; text-align: center; border-bottom: 2px dashed #ff6b81; padding-bottom: 8px; width: fit-content; margin-left: auto; margin-right: auto; }

.interrupt-btn { padding: 6px 16px; border: 1px solid #ddd; border-radius: 999px; background: #fff; color: #6b7280; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
.interrupt-btn:hover { background: #f9fafb; color: #333; transform: translateY(-2px); }

.floating { animation: float 3s ease-in-out infinite; }
@keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
</style>
</head>

<body>
<button type="button" onclick="playBackTopAndGo('index.html')" class="top-return-btn" id="top-return-btn">← トップページに戻る</button>

<div class="blur-circle blue-main"></div>
<div class="blur-circle blue-sub"></div>

<div class="main-wrapper">
    <div class="sidebar-left glass-panel">
        <h2>📘 ディスカッションの流れ</h2>
        <p>① 前提定義<br>→ 言葉や前提を揃える<br><br>② 課題特定<br>→ 何が本質か整理する<br><br>③ アイデア出し<br>→ 比較・具体化する<br><br>④ まとめ<br>→ 結論を論理的に整理</p>
    </div>

    <div class="container glass-panel">
        <div id="controls" style="display:flex; justify-content:flex-start; margin-bottom: 15px; display:none;">
            <button type="button" class="interrupt-btn" onclick="interruptTest()">⏸ やめる</button>
        </div>

        <div id="current-theme-display">テーマ：<span id="theme-name"></span></div>

        <div class="progress-wrapper">
            <div class="progress-bar"><div id="progress"></div></div>
            <div class="progress-labels" id="labels-text"><span>前提</span><span>課題</span><span>アイデア</span><span>まとめ</span></div>
        </div>
        
        <h2 id="text"></h2>
        
        <!-- BGMプレイリストUI -->
        <div id="bgm-selector-container" class="bgm-selector" style="display: none;">
            <label style="font-size: 1.05rem; color: #888;">BGMプレイリスト</label>
            <div style="display: flex; align-items: center; gap: 20px;">
                <button type="button" class="arrow-btn" onclick="changeBgm(-1)">◀</button>
                <div id="bgm-display" style="font-size: 1.6rem; font-weight: 900; color: #4aa8ff; width: 60px; text-align: center;">1</div>
                <button type="button" class="arrow-btn" onclick="changeBgm(1)">▶</button>
            </div>
        </div>

        <div id="interactive-area">
            <div id="choices"></div>
            <p id="feedback"></p>
            <button id="next-step-btn" type="button">次へ進む</button>
        </div>
    </div>

    <div class="sidebar-right">
        <div id="prof-container" class="floating" onclick="talkToProf()">
            <div id="prof-bubble" class="prof-bubble-large">ディスカッションを始めよう！</div>
            <img id="prof-avatar" src="picture/ozawasensei/ozawa_default.png" alt="小澤先生">
        </div>
    </div>
</div>

<script>
// 音声ファイルパス
const seStart = new Audio('sound/SE/start.mp3');
const seCorrect = new Audio('sound/SE/correct.mp3');
const seWrong = new Audio('sound/SE/wrong.mp3');
const seNeutral = new Audio('sound/SE/neutral.mp3');
const seBackTop = new Audio('sound/SE/back_top.mp3');
const seProfClick = new Audio('sound/SE/prof_click.mp3');
const seReset = new Audio('sound/SE/reset.mp3');
const seResultGood = new Audio('sound/SE/result_good.mp3');
const seResultMid = new Audio('sound/SE/result_mid.mp3');
const seResultBad = new Audio('sound/SE/result_bad.mp3');
const seNext = new Audio('sound/SE/modal_open.mp3');
const seModalOpen = new Audio('sound/SE/modal_open.mp3');
const seBackStart = new Audio('sound/SE/back_start.mp3'); // 追加：スタートへ戻る音

// BGM設定
let currentBgmIndex = 1;
const bgm = new Audio(`sound/BGM/discussion/discussion_${currentBgmIndex}.mp3`);
bgm.loop = true;
bgm.volume = 0.4;

let isExiting = false;

function playSE(audio) {
    if (isExiting && audio !== seBackTop) return;
    // 音声ノードを複製して独立して鳴らすことで、連続再生時の途切れを防ぐ
    let soundClone = audio.cloneNode(true);
    soundClone.volume = audio.volume || 1.0;
    soundClone.play().catch(()=>{});
}

function playBackTopAndGo(url) {
    isExiting = true;
    bgm.pause(); // 遷移時にBGMを停止
    playSE(seBackTop);
    setTimeout(() => { window.location.href = url; }, 400);
}

// BGM切り替え機能
window.changeBgm = function(dir) {
    playSE(seModalOpen);
    currentBgmIndex += dir;
    if (currentBgmIndex > 5) currentBgmIndex = 1;
    if (currentBgmIndex < 1) currentBgmIndex = 5;
    
    const disp = document.getElementById('bgm-display');
    if (currentBgmIndex === 5) {
        disp.innerText = "なし";
        bgm.pause();
    } else {
        disp.innerText = currentBgmIndex;
        const wasPlaying = !bgm.paused;
        bgm.src = `sound/BGM/discussion/discussion_${currentBgmIndex}.mp3`;
        // UIがプレイ中（コントロールが表示されている）であれば再生
        if (wasPlaying && document.getElementById("controls").style.display !== "none") {
            bgm.play().catch(e => console.log("BGM play failed", e));
        }
    }
};

// 🌟 修正：新しい中断音・戻る音のルール適用
function interruptTest() {
    playSE(seReset); // 押した瞬間にリセット音
    setTimeout(() => {
        if(confirm("本当にスタート画面に戻りますか？\n現在の議論の進行状況は失われます。")){
            bgm.pause(); // BGMを停止
            playSE(seBackStart); // OK時にスタートへ戻る音
            startTheme();
        } else {
            playSE(seBackTop); // キャンセル時に戻る音
        }
    }, 50);
}

let score = 0;
let stepCount = 0;
let totalSteps = 4;
let currentTheme = "";

const themes = ["AI規制は必要か？","キャンセルカルチャー","AIは友達になれるか？","クロノタイプ","立教水","Google新ビジネス"];

let discProfPool = [];
let discProfIndex = 0;

function setOzawaState(state, customText = "") {
    if(state === "normal") {
        discProfPool = [
            {text: customText || "議論の本質はどこにあるかな？", img: "picture/ozawasensei/ozawa_default.png"}, 
            {text: "ロジカルに考えてみよう！", img: "picture/ozawasensei/ozawa_default.png"}, 
            {text: "自分の意見をしっかり持とうじゃないか。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "表面的な問題に囚われてはいけないよ。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "色々な視点からアプローチしてみよう。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "前提がズレると、結論もズレてしまうからね。", img: "picture/ozawasensei/ozawa_default.png"}
        ];
    } else if(state === "correct") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_laugh.png"}, 
            {text: "その通り！いい視点だね。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "素晴らしい。本質を突いているよ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "そのロジック、とても説得力があるね。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "おおっ、そこに着眼するとはお見事！", img: "picture/ozawasensei/ozawa_laugh.png"}
        ];
    } else if(state === "wrong") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_angry.png"}, 
            {text: "うーん、少し論点がずれているかも。", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "もう少し深く掘り下げてみようか。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "その視点も面白いが、今回のテーマの核とは違うかな。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "思い込みで判断していないか？ロジックを再確認しよう。", img: "picture/ozawasensei/ozawa_angry.png"}
        ];
    } else if(state === "end_perfect") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "この調子で実際のゼミでも活躍してくれ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "とはいえ、現実の議論はもっと複雑だからな。慢心は禁物だぞ！", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "君のような鋭い視点を持つ学生をゼミで待っているよ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "満点だ！ディスカッションの基本が完全に身についているね。", img: "picture/ozawasensei/ozawa_laugh.png"}
        ];
    } else if(state === "end_high") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_default.png"},
            {text: "良い視点を持っているね。さらに多角的に考えられれば完璧だ。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "結果に満足して油断してはいけないよ。常に論理を磨き続けなさい！", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "惜しい！あと少しで本質を完全に捉えられたはずだ。", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "この悔しさをバネに、ゼミでさらに鍛え上げていこう！", img: "picture/ozawasensei/ozawa_laugh.png"}
        ];
    } else if(state === "end_low") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "次は『前提』と『課題』が本当に結びついているか確認してみよう。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "失敗から学ぶことこそがディスカッションの醍醐味だよ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "最初は難しく感じるかもしれないが、場数を踏めば必ず上達するよ。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "論理の飛躍に気をつけながら、もう一度チャレンジしてみなさい！", img: "picture/ozawasensei/ozawa_default.png"}
        ];
    } else if(state === "end_zero") {
        discProfPool = [
            {text: customText, img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "落ち着いて、もう一度『前提』から論理を組み立て直すんだ。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "最初からできる人はいないさ。何度も挑戦して感覚を掴むんだ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "思いつきだけで語らず、事実とロジックを積み重ねる意識を持とう。", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "ゼミに入れば、基礎からみっちり鍛えてあげるから安心してくれ！", img: "picture/ozawasensei/ozawa_laugh.png"}
        ];
    } else if(state === "start") {
        discProfPool = [
            {text: "好きなテーマを選んでみよう！", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "どれも今の社会で重要な問いばかりだぞ。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "正解のない問題にどう立ち向かうか、お手並み拝見といこう。", img: "picture/ozawasensei/ozawa_default.png"}
        ];
    }
    discProfIndex = 0;
    applyOzawaMsg();
}

function talkToProf() {
    playSE(seProfClick);
    discProfIndex = (discProfIndex + 1) % discProfPool.length;
    applyOzawaMsg();
}

function applyOzawaMsg() {
    const data = discProfPool[discProfIndex];
    const bubble = document.getElementById("prof-bubble"); 
    const avatar = document.getElementById("prof-avatar");
    
    bubble.innerHTML = data.text; 
    avatar.src = data.img;

    const wrapper = document.getElementById("prof-container");
    wrapper.style.animation = 'none';
    wrapper.offsetHeight; 
    wrapper.style.animation = 'float 3s ease-in-out infinite';
}

function updateLabels() {
  const labelsContainer = document.getElementById("labels-text");
  labelsContainer.innerHTML = "<span>前提</span><span>課題</span><span>アイデア</span><span>まとめ</span>"; 
}

function render(text,choices){
  stepCount = Math.min(stepCount + 1, totalSteps);
  document.getElementById("progress").style.width = (stepCount / totalSteps * 100) + "%";
  document.getElementById("text").innerText = text;
  
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("next-step-btn");
  feedback.style.display = "none";
  nextBtn.style.display = "none";
  
  if (!text.includes("あなたの論理スコア:") && text !== "体験するディスカッションテーマを選択してください") {
      setOzawaState("normal");
  }

  const div = document.getElementById("choices");
  div.innerHTML = "";

  let displayChoices = [...choices];
  let hasNeutral = displayChoices.some(c => c.neutral);
  
  if (text !== "体験するディスカッションテーマを選択してください" && !text.includes("別のテーマで遊ぶ") && !hasNeutral) {
      displayChoices.sort(() => Math.random() - 0.5);
  }

  displayChoices.forEach(c=>{
    const b = document.createElement("button"); 
    b.type = "button"; 
    b.className = "choice-btn"; 
    b.innerText = c.label;
    b.onclick = ()=>{
      
      const allBtns = div.querySelectorAll("button");
      allBtns.forEach(btn => {
          if(btn !== b) {
              btn.style.display = 'none'; 
          } else {
              btn.disabled = true;
              btn.classList.add("selected");
          }
      });

      if (c.actionOnly) {
          c.next();
          return;
      }
      
      feedback.style.display = "block";

      if (c.isThemeSelect) {
        playSE(seStart);
        feedback.style.color = "#4aa8ff";
        feedback.style.borderColor = "rgba(74,168,255,0.3)";
        feedback.innerText = `テーマ「${c.label}」を開始します！`;
        setOzawaState("normal", "いいテーマだね！さっそく始めよう。");
        setTimeout(()=>{ c.next(); }, 1000); 
        return;
      }

      nextBtn.style.display = "block";
      nextBtn.onclick = () => {
          playSE(seNext);
          c.next();
      };

      if(c.neutral){
        playSE(seNeutral);
        feedback.style.color = "#4aa8ff"; 
        feedback.style.borderColor = "rgba(74,168,255,0.4)";
        feedback.innerHTML = "💡 <b>" + (c.explain || "その方針で議論を進めましょう") + "</b>";
        setOzawaState("normal", "なるほど、その方針だね！");
      }
      else if(c.good){
        score++;
        playSE(seCorrect);
        feedback.style.color = "#2b8a3e"; 
        feedback.style.borderColor = "rgba(43,138,62,0.4)";
        feedback.innerHTML = "✅ <b>正解：</b>" + (c.explain || "素晴らしい視点です！");
        setOzawaState("correct", "その通り！いい視点だね！");
      }else{
        playSE(seWrong);
        feedback.style.color = "#c92a2a"; 
        feedback.style.borderColor = "rgba(201,42,42,0.4)";
        feedback.innerHTML = "⚠ <b>惜しい：</b>" + (c.explain || "別視点の考え方です");
        setOzawaState("wrong", "うーん、少し論点がずれているかな？");
      }
    };
    div.appendChild(b);
  });
}

function startTheme(){
  score = 0; stepCount = 0; totalSteps = 4;
  document.getElementById("progress").style.width = "0%";
  document.getElementById("current-theme-display").style.display = "none";
  document.getElementById("controls").style.display = "none"; 
  document.getElementById("top-return-btn").style.display = "inline-block"; 
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next-step-btn").style.display = "none";
  
  // BGMセレクタを表示
  document.getElementById("bgm-selector-container").style.display = "flex";
  updateLabels();

  render("体験するディスカッションテーマを選択してください",themes.map(t=>({
    label:t, isThemeSelect: true, 
    next:()=>{
      currentTheme = t; stepCount = 0;
      document.getElementById("theme-name").innerText = t;
      document.getElementById("current-theme-display").style.display = "block";
      document.getElementById("controls").style.display = "flex"; 
      document.getElementById("top-return-btn").style.display = "none"; 
      
      // BGMセレクタを隠す
      document.getElementById("bgm-selector-container").style.display = "none";

      // BGM再生開始
      if (currentBgmIndex !== 5) {
          bgm.currentTime = 0;
          bgm.play().catch(e => console.log("BGM play failed", e));
      }

      if(t==="AI規制は必要か？"){ aiDefine(); }
      else if(t==="キャンセルカルチャー"){ cancelDefine(); }
      else if(t==="AIは友達になれるか？"){ friendDefine(); }
      else if(t==="クロノタイプ"){ chronoDefine(); }
      else if(t==="立教水"){ waterDefine(); }
      else if(t==="Google新ビジネス"){ googleDefine(); }
    }
  })));
  stepCount = 0; document.getElementById("progress").style.width = "0%";
  setOzawaState("start");
}

      { label:"イノベーション加速による経済発展", good:false, explain:"競争は加速しますが、社会的リスク（偽情報など）への対策が抜け落ちてしまいます。", next:aiConclusion },

  { label:"完全無料戦略をさらに拡大する", good:false, explain:"AIの開発・サーバー維持コストが膨大になり、収益性が崩壊します。", next:resultStep }, 
  { label:"他社のAIモデルをひたすらコピーして追従する", good:false, explain:"トップ企業としての優位性とブランドを放棄し、長期的には衰退します。", next:resultStep } 
]); }

function resultStep(){
  bgm.pause(); // 終了時にBGM停止
  let msg = "";
  let stateKey = "";
  let stateMsg = "";
  
  if(score === 4){ 
    msg = "🎉 完璧なロジックだ！君の視点は非常に鋭いよ！";
    stateKey = "end_perfect";
    stateMsg = "完璧なロジックだ！君の視点は非常に鋭いよ！";
    playSE(seResultGood);
  }else if(score === 3){
    msg = "🙂 かなり良い線を行っているね！あともう一歩で完璧だ。";
    stateKey = "end_high";
    stateMsg = "かなり良い線を行っているね！あともう一歩で完璧だ。";
    playSE(seResultMid);
  }else if(score === 1 || score === 2){
    msg = "🤔 うーん、少し論理が飛躍してしまったかな。前提から見直そう。";
    stateKey = "end_low";
    stateMsg = "うーん、少し論理が飛躍してしまったかな。前提から見直そう。";
    playSE(seResultMid);
  }else{
    msg = "💢 なんだこの議論は！これでは何も解決しないぞ！";
    stateKey = "end_zero";
    stateMsg = "なんだこの議論は！これでは何も解決しないぞ！";
    playSE(seResultBad);
  }

  msg += `\n（あなたの論理スコア: ${score} / ${totalSteps}）`;
  document.getElementById("feedback").style.color = "#2b8a3e";
  
  render(msg,[
    {
      label:"別のテーマで遊ぶ（タイトルに戻る）",
      actionOnly: true,
      next:()=>{ 
          playSE(seBackStart); // 🌟 別のテーマへ遊ぶ際もスタートへ戻る音
          startTheme(); 
      } 
    }
  ]);
  document.getElementById("progress").style.width = "100%";
  
  setOzawaState(stateKey, stateMsg);
}

startTheme();
</script>
