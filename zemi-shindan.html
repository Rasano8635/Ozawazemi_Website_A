// 🌟 修正：音声をクローンして再生することで、連続クリック時の途切れを防止
function playSE(audio) {
    if (isExiting && audio !== seBackTop) return;
    let soundClone = audio.cloneNode(true);
    soundClone.volume = audio.volume || 1.0;
    soundClone.play().catch(()=>{});
}

function playBackTopAndGo(url) {
    isExiting = true; 
    bgm.pause(); 
    playSE(seBackTop);
    setTimeout(() => { window.location.href = url; }, 400);
}

window.changeBgm = function(dir) {
    playSE(seModalOpen);

        shindanRandomPool = [
            {text: "ふむふむ…なるほど。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "自分の頭で考えるんだ！", img: "picture/ozawasensei/ozawa_angry.png"},
            {text: "その調子だ！どんどん進もう。", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "飲みゼミじゃない、賢く遊ぶゼミだよ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "君はリーダー気質かな？それともサポーター？", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "迷ったら、最初の直感を信じるんだ。", img: "picture/ozawasensei/ozawa_laugh.png"}
        ];
    } else if (state === "result") {
        if (type === "小澤康裕") {
            shindanInitialMsg = {text: "私と全く同じ思考とは…君にはゼミを任せたよ！", img: "picture/ozawasensei/ozawa_laugh.png"};
            shindanRandomPool = [ {text: "私と全く同じ思考とは…君にはゼミを任せたよ！", img: "picture/ozawasensei/ozawa_laugh.png"} ];
        } else {
            shindanInitialMsg = {text: `おめでとう！君は「${type}」だ！`, img: "picture/ozawasensei/ozawa_laugh.png"};
            shindanRandomPool = [
                {text: "この結果をゼミ選びの参考にしてみてね！", img: "picture/ozawasensei/ozawa_default.png"},
                {text: "どんな強みもゼミでは必要不可欠な要素なんだ。", img: "picture/ozawasensei/ozawa_laugh.png"},
                {text: "トップページから他のコンテンツも遊んでみてね！", img: "picture/ozawasensei/ozawa_default.png"},
                {text: "同じタイプの先輩に話を聞いてみるのもいいぞ。", img: "picture/ozawasensei/ozawa_laugh.png"}
            ];
        }
    } else {
        shindanInitialMsg = {text: "君の強みを見つけてみよう！", img: "picture/ozawasensei/ozawa_default.png"};
        shindanRandomPool = [
            {text: "ゼミでどんな役割が合うかズバリ診断するぞ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "素直に、深く考えずに答えるのがコツだ。", img: "picture/ozawasensei/ozawa_default.png"},
            {text: "クリックするとセリフが変わるぞ！", img: "picture/ozawasensei/ozawa_laugh.png"},
            {text: "トップページには他にもコンテンツがあるよ。", img: "picture/ozawasensei/ozawa_default.png"}
        ];
    }
    
    shuffleShindanPool();
    shindanMsgIndex = -1;
    applyOzawaMsg();
}

function shuffleShindanPool() {
    for (let i = shindanRandomPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shindanRandomPool[i], shindanRandomPool[j]] = [shindanRandomPool[j], shindanRandomPool[i]];
    }
    if (shindanRandomPool.length > 1 && shindanRandomPool[0].text === lastShindanMessageText) {
        [shindanRandomPool[0], shindanRandomPool[1]] = [shindanRandomPool[1], shindanRandomPool[0]];
    }
}

function talkToProf() {
    playSE(seProfClick);
    shindanMsgIndex++;
    if (shindanMsgIndex >= shindanRandomPool.length) {
        shuffleShindanPool();
        shindanMsgIndex = 0;
    }
    applyOzawaMsg();
}

function applyOzawaMsg() {
    let data = shindanMsgIndex === -1 ? shindanInitialMsg : shindanRandomPool[shindanMsgIndex];
    const bubble = document.getElementById("ozawa-bubble"); 
    const img = document.getElementById("ozawa-img");

    lastShindanMessageText = data.text;
    bubble.innerHTML = data.text;
    img.src = data.img;

    bubble.style.animation = 'none';
    bubble.offsetHeight; 
    bubble.style.animation = 'float 3s ease-in-out infinite';
}

function startTest(){
    playSE(seStart);
    document.getElementById("top-return-btn").style.display = "none";
    if (currentBgmIndex !== 5) {
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("BGM play failed", e));
    }
    current = 0; discussionScore = 0; challengeScore = 0; scoreHistory = [];
    document.getElementById("start").style.display="none"; document.getElementById("result").style.display="none"; document.getElementById("quiz").style.display="block";
    showQuestion();
}

function showQuestion() {
    document.getElementById("btn-goback").style.visibility = (current === 0) ? "hidden" : "visible";
    document.getElementById("question").textContent=questions[current].text;
    document.getElementById("progress").textContent=`${current+1} / ${questions.length}`;
    const progress=(current / questions.length) * 100; document.getElementById("progressBar").style.width=progress+"%";
    const q=document.getElementById("question"); q.style.animation="none"; q.offsetHeight; q.style.animation="pop .4s ease";
    document.querySelectorAll(".answer-buttons button").forEach(b=>b.classList.remove("selected"));
    updateOzawa("quiz");
}

function selectButton(btn){
    document.querySelectorAll(".answer-buttons button").forEach(b=>b.classList.remove("selected")); btn.classList.add("selected");
}

function answer(point){
    playSE(seSelect); 
    scoreHistory.push({ discussion: discussionScore, challenge: challengeScore, answerPoint: point }); 
    const q=questions[current]; if(q.reverse) point=6-point;
    if(q.axis==="discussion"||q.axis==="analysis"){ discussionScore+=point; }
    if(q.axis==="challenge"||q.axis==="stable"){ challengeScore+=point; }
    current++;
    if(current < questions.length){ setTimeout(showQuestion, 160); }
    else{ document.getElementById("progressBar").style.width="100%"; document.getElementById("progress").textContent=`${questions.length} / ${questions.length}`; setTimeout(showResult, 250); }
}

function goBack() {
    if (current === 0) return;
    playSE(seBackTop);
    current--;
    const lastState = scoreHistory.pop();
    discussionScore = lastState.discussion;
    challengeScore = lastState.challenge;
    showQuestion();
}

function interruptTest() {
    playSE(seReset);
    setTimeout(() => {
        if(confirm("本当にスタート画面に戻りますか？\n現在の診断状況は失われます。")){
            bgm.pause(); 
            playSE(seBackStart);
            document.getElementById("quiz").style.display="none";
            document.getElementById("start").style.display="block";
            document.getElementById("top-return-btn").style.display="inline-block";
            updateOzawa("start");
        } else {
            playSE(seBackTop);
        }
    }, 50);
}

function showResult(){
    bgm.pause(); 
    playSE(seClear); 
    document.getElementById("quiz").style.display="none"; document.getElementById("result").style.display="block";
    const isOzawa = scoreHistory.length === 10 && scoreHistory.every((h, i) => h.answerPoint === ozawaAnswers[i]);
    const discussionType=discussionScore>=15; const challengeType=challengeScore>=15;
    let type=""; let description=""; let image="";
    const typeEl = document.getElementById("type");
    if (isOzawa) {
        type = "小澤康裕";
        description = "素晴らしい！なんとすべての質問に対する選択が小澤先生と100%完全一致しました！君の思考ロジックは小澤先生そのもの、まさに『歩く大論破王』です。今すぐゼミの主宰を交代するか、教授の座を譲り受ける準備を始めましょう！";
        image = "picture/ozawasensei/ozawa_laugh.png";
        typeEl.style.background = "linear-gradient(90deg, #ff6ec7, #8b5cf6, #22d3ee, #fbbf24)";
        typeEl.style.webkitBackgroundClip = "text";
        typeEl.style.webkitTextFillColor = "transparent";
        typeEl.style.textShadow = "0 8px 20px rgba(139,92,246,0.3)";
    } else {
        typeEl.style.background = "none";
        typeEl.style.webkitBackgroundClip = "unset";
        typeEl.style.webkitTextFillColor = "initial";
        typeEl.style.color = "#2d5f88";
        typeEl.style.textShadow = "none";
        if(discussionType&&challengeType){ type="わくわくうさぎ"; description="新しいことに積極的に挑戦できるタイプ！アイデア豊富で行動力抜群、ゼミのイノベーションを引っ張る存在です。"; image="picture/type/usagi.png"; }
        else if(discussionType&&!challengeType){ type="お世話いぬ"; description="周囲を支えながらみんなをまとめるタイプ！高いコミュニケーション能力でゼミ内の調整やチームワークを円滑にします。"; image="picture/type/inu.png"; }
        else if(!discussionType&&challengeType){ type="リーダーライオン"; description="論理的に考えて戦略を立てるタイプ！冷静な分析力と強い意志で、前例のない課題に対しても的確なロードマップを描きます。"; image="picture/type/lion.png"; }
        else{ type="ロジカルりす"; description="慎重に分析しながら研究を支えるタイプ！データの違和感を見逃さず、緻密な資料作成や堅実な議論の土台を作ってくれます。"; image="picture/type/risu.png"; }
    }
    document.getElementById("type").textContent=type; document.getElementById("description").textContent=description; document.getElementById("resultImage").src=image;
    const sameTypeContainer = document.getElementById("same-type-members");
    const titleTextEl = document.getElementById("same-type-title-text");
    const facesContainer = document.getElementById("member-faces-container");
    facesContainer.innerHTML = ""; 
    if (isOzawa) {
        sameTypeContainer.style.display = "block";
        titleTextEl.textContent = "✨ 同じタイプのゼミメンバー ✨";
        facesContainer.innerHTML = "<p style='color: #888; font-weight: 700; font-size: 0.95rem; margin: 10px 0;'>現在このタイプに所属するゼミ生はいません。<br>君が最初の『小澤先生タイプ』だ！</p>";
    } else {
        titleTextEl.textContent = "✨ 同じタイプのゼミメンバー ✨";
        const sameMembers = zemiMembers.filter(m => m.type === type);
        if (sameMembers.length > 0) {
            sameTypeContainer.style.display = "block";
            sameMembers.forEach(m => {
                const div = document.createElement("div");
                div.className = "member-face-item";
                const imgEl = document.createElement("img");
                imgEl.className = "member-face-img";
                imgEl.src = m.img; imgEl.alt = m.name;
                const nameEl = document.createElement("div");
                nameEl.className = "member-face-name";
                nameEl.innerHTML = `${m.name}<br><span style="font-size: 0.7rem; color: #888;">(${m.grade})</span>`;
                div.appendChild(imgEl); div.appendChild(nameEl); facesContainer.appendChild(div);
            });
        } else { sameTypeContainer.style.display = "none"; }
    }
    updateOzawa("result", type);
}

function resetTest() {
    playSE(seBackStart); 
    document.getElementById("result").style.display="none"; 
    document.getElementById("start").style.display="block";
    document.getElementById("top-return-btn").style.display="inline-block";
    updateOzawa("start");
}

updateOzawa("start");
</script>
</body>
</html>
